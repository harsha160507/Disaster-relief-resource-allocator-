spring.application.name=DisasterReliefBackend

# Production PostgreSQL configuration. These variables are intentionally required
# so the application never starts against an accidental or in-memory database.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Production must validate an existing schema and must never create, alter, or
# drop tables automatically.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

# Flyway owns schema creation/upgrades and runs before Hibernate validation.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.fail-on-missing-locations=true
spring.flyway.baseline-on-migrate=false
spring.flyway.clean-disabled=true
